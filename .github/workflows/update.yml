name: Actualisation Automatique des Offres

on:
  schedule:
    - cron: '0 */3 * * *' # S'exécute automatiquement toutes les 3 heures
  workflow_dispatch:       # Permet de forcer une mise à jour manuelle en 1 clic

permissions:
  contents: write

jobs:
  refresh-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer la bibliothèque requests
        run: pip install requests

      - name: Exécuter le radar d'offres
        run: python tracker.py

      - name: Sauvegarder les nouvelles offres dans jobs.json
        run: |
          git config --global user.name 'CareerTech Bot'
          git config --global user.email 'bot@careertech.local'
          git add jobs.json
          git diff --staged --quiet || (git commit -m "Auto-sync: actualisation des offres" && git push)
